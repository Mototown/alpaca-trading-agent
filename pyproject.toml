[project]
name = "alpaca-trading-agent"
version = "0.1.0"
description = "Dynamic Adaptive Hedging Agent — Alpaca AI Hackathon 2026"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.28.0",
    "openai>=1.40.0",
    "py-vollib>=1.0.1",
    "scipy>=1.13.0",
    "aiosqlite>=0.20.0",
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
daha = "agent.main:run"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
